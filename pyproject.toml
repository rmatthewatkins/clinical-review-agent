[project]
name = "readmission-review-agent"
version = "0.1.0"
description = "AI-powered clinical readmissions review agent using synthetic FHIR data"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "anthropic>=0.40.0",
    "matplotlib>=3.8.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "respx>=0.21.0",
]

[project.scripts]
readmission-agent = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
