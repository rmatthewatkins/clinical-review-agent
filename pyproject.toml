[project]
name = "clinical-review-agent"
version = "0.3.0"
description = "AI-powered clinical case review agent (30-day readmissions, inpatient mortality) over FHIR R4, Synthea, and MIMIC-III data"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0,<1.0",
    "anthropic>=0.40.0,<1.0",
    "matplotlib>=3.8.0,<4.0",
    "rich>=13.0.0,<14.0",
    "httpx>=0.27.0,<1.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "psycopg-pool>=3.1.0,<4.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
]

[project.optional-dependencies]
mimic = [
    "google-cloud-bigquery>=3.25.0,<4.0",
]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.0.0,<6.0",
    "respx>=0.21.0,<1.0",
    "httpx>=0.27.0,<1.0",
]

[project.scripts]
clinical-review-agent = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinical_review_agent"]
